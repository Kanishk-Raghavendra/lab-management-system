{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-8">
            <div class="card bg-dark">
                <div class="card-header">
                    <h3>{{ title }}</h3>
                </div>
                <div class="card-body">
                    <form method="POST" action="{{ form_action }}">
                        <div class="mb-3">
                            <label for="lab_name" class="form-label">Lab Name</label>
                            <input type="text" class="form-control" id="lab_name" name="lab_name" 
                                   value="{{ lab.lab_name if lab else '' }}" required>
                        </div>
                        <div class="mb-3">
                            <label for="lab_type" class="form-label">Lab Type</label>
                            <select class="form-select" id="lab_type" name="lab_type">
                                <option value="Chemistry" {% if lab and lab.lab_type == 'Chemistry' %}selected{% endif %}>Chemistry</option>
                                <option value="Physics" {% if lab and lab.lab_type == 'Physics' %}selected{% endif %}>Physics</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="location" class="form-label">Location</label>
                            <input type="text" class="form-control" id="location" name="location" 
                                   value="{{ lab.location if lab else '' }}">
                        </div>
                        
                        <button type="submit" class="btn btn-primary">Save Lab</button>
                        <a href="{{ url_for('main_routes.lab_list') }}" class="btn btn-secondary">Cancel</a>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
