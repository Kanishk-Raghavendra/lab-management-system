{% extends "base.html" %}

{% block content %}
    <h1>{{ title }}</h1>
    <p class="text-muted">Select an item from inventory to log maintenance for. This will set the item's status to "Maintenance".</p>

    <form method="POST">
        <div class="mb-3">
            <label for="inventory_id" class="form-label">Inventory Item</label>
            <select class="form-select" id="inventory_id" name="inventory_id" required>
                <option value="" disabled selected>Select an item...</option>
                {% for item in inventory_items %}
                    <option value="{{ item.inventory_id }}">{{ item.lab_name }} - {{ item.item_name }}</option>
                {% endfor %}
            </select>
        </div>
        
        <div class="mb-3">
            <label for="description" class="form-label">Description of Issue</label>
            <textarea class="form-control" id="description" name="description" rows="3" required></textarea>
        </div>
        
        <button type="submit" class="btn btn-warning">Log Maintenance</button>
        <a href="{{ url_for('main_routes.maintenance_list') }}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
