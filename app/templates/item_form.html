{% extends "base.html" %}

{% block content %}
    <h1>{{ title }}</h1>

    <form method="POST" action="{{ form_action }}">
        <div class="mb-3">
            <label for="item_name" class="form-label">Item Name</label>
            <input type="text" class="form-control" id="item_name" name="item_name" 
                   value="{{ item.item_name if item else '' }}" required>
        </div>
        
        <div class="mb-3">
            <label for="item_type" class="form-label">Item Type</label>
            <select class="form-select" id="item_type" name="item_type">
                <option value="Equipment" {% if item and item.item_type == 'Equipment' %}selected{% endif %}>
                    Equipment
                </option>
                <option value="Consumable" {% if item and item.item_type == 'Consumable' %}selected{% endif %}>
                    Consumable
                </option>
            </select>
        </div>

        <div class="mb-3">
            <label for="description" class="form-label">Description</label>
            <textarea class="form-control" id="description" name="description" rows="3">{{ item.description if item else '' }}</textarea>
        </div>

        <div class="row">
            <div class="col-md-6 mb-3">
                <label for="unit_price" class="form-label">Unit Price</label>
                <div class="input-group">
                    <span class="input-group-text">$</span>
                    <input type="number" step="0.01" class="form-control" id="unit_price" name="unit_price" 
                           value="{{ '%.2f'|format(item.unit_price) if item and item.unit_price is not none else '0.00' }}" required>
                </div>
            </div>
            <div class="col-md-6 mb-3">
                <label for="min_stock_level" class="form-label">Minimum Stock Level</label>
                <input type="number" class="form-control" id="min_stock_level" name="min_stock_level" 
                       value="{{ item.min_stock_level if item else 0 }}" required>
            </div>
        </div>
        
        <button type="submit" class="btn btn-primary">Save Item</button>
        <a href="{{ url_for('main_routes.item_list') }}" class="btn btn-secondary">Cancel</a>
    </form>
{% endblock %}
