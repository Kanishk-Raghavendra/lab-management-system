{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Manage Staff</h1>
        <a href="{{ url_for('main_routes.new_staff') }}" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> Add New Staff
        </a>
    </div>

    <div class="card bg-dark">
        <div class="table-responsive">
            <table class="table table-dark table-striped table-hover align-middle">
                <thead>
                    <tr>
                        <th>Name</th>
                        <th>Email</th>
                        <th>Role</th>
                        <th>Assigned Lab</th>
                        <th class="actions">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for s in staff_members %}
                    <tr>
                        <td>{{ s.name }}</td>
                        <td>{{ s.email }}</td>
                        <td><span class="badge bg-secondary">{{ s.role_name }}</span></td>
                        <td>{{ s.lab_name or 'N/A' }}</td>
                        <td class="actions">
                            <a href="{{ url_for('main_routes.edit_staff', staff_id=s.staff_id) }}" class="btn btn-sm btn-outline-primary">Edit</a>
                            <form action="{{ url_for('main_routes.delete_staff', staff_id=s.staff_id) }}" method="POST" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this staff member? This cannot be undone.');">
                                <button type.="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="5" class="text-center">No staff found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
{% endblock %}
