{% extends "base.html" %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6 col-lg-5">
        <div class="card shadow-lg border-primary">
            <div class="card-header text-center bg-primary text-white">
                <h3 class="mb-0"><i class="fa-solid fa-right-to-bracket"></i> Login to LabLink</h3>
            </div>
            <div class="card-body p-4">
                <form method="POST" action="">
                    <div class="mb-3">
                        <label for="email" class="form-label"><i class="fa-solid fa-envelope"></i> Email</label>
                        <input type="email" class="form-control form-control-lg" name="email" id="email" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="password" class="form-label"><i class="fa-solid fa-lock"></i> Password</label>
                        <input type="password" class="form-control form-control-lg" name="password" id="password" required>
                    </div>
                    
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="remember" id="remember">
                        <label class="form-check-label" for="remember">
                            Remember Me
                        </label>
                    </div>
                    
                    <div class="d-grid">
                        <button type="submit" class="btn btn-primary btn-lg">Login</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
