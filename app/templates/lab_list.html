{% extends "base.html" %}

{% block content %}
<div class="container">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h1>Manage Labs</h1>
        <a href="{{ url_for('main_routes.new_lab') }}" class="btn btn-primary">
            <i class="fa-solid fa-plus"></i> Add New Lab
        </a>
    </div>
    
    <div class="card bg-dark">
        <div class="table-responsive">
            <table class="table table-dark table-striped table-hover align-middle">
                <thead>
                    <tr>
                        <th>Lab Name</th>
                        <th>Type</th>
                        <th>Location</th>
                        <th class="actions">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for lab in labs %}
                    <tr>
                        <td>{{ lab.lab_name }}</td>
                        <td>{{ lab.lab_type }}</td>
                        <td>{{ lab.location }}</td>
                        <td class="actions">
                            <a href="{{ url_for('main_routes.edit_lab', lab_id=lab.lab_id) }}" class="btn btn-sm btn-outline-primary">Edit</a>
                            <form action="{{ url_for('main_routes.delete_lab', lab_id=lab.lab_id) }}" method="POST" class="d-inline" onsubmit="return confirm('Are you sure you want to delete this lab? This will ONLY work if no staff, students, or inventory are assigned to it.');">
                                <button type="submit" class="btn btn-sm btn-outline-danger">Delete</button>
                            </form>
                        </td>
                    </tr>
                    {% else %}
                    <tr>
                        <td colspan="4" class="text-center">No labs found.</td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
    <a href="{{ url_for('main_routes.admin_page') }}" class="btn btn-secondary mt-3">Back to Admin Panel</a>
</div>
{% endblock %}
